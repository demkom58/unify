[package]
name = "unify"
version = "0.2.0"
edition = "2021"
description = "A file unification tool that joins text files according to gitignore-style patterns"
license = "MIT"
readme = "README.md"

[features]
default = []
tokens = ["tiktoken-rs"]

[dependencies]
# CLI
clap = { version = "4.5.57", features = ["derive"] }

# Error handling
anyhow = "1.0.101"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9.11"

# File walking & pattern matching (replaces: glob, walkdir, hand-rolled matcher)
ignore = "0.4.25"

# Binary file detection (replaces: hand-rolled is_binary_file)
content_inspector = "0.2.4"

# Human-readable byte sizes (replaces: parse_size, format_size functions)
bytesize = { version = "2", features = ["serde"] }

# Progress bar
indicatif = "0.18.3"

# Cross-platform config directories
dirs = "6"

# Optional: LLM token counting
tiktoken-rs = { version = "0.9.1", optional = true }
