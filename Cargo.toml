[package]
name = "unify"
version = "1.0.0"
edition = "2024"
authors = ["Max Demydenko <demkom58@gmail.com>"]
description = "A file unification tool that combines text files according to gitignore-style patterns"
repository = "https://github.com/demkom58/unify"
license = "MIT"
readme = "README.md"
keywords = ["cli", "file", "unify", "code", "review"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
glob = "0.3"
ignore = "0.4"
memchr = "2.5"
walkdir = "2.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true